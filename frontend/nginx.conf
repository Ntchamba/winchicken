# Production web server (frontend/Dockerfile `prod` stage, docker-compose.prod.yml `frontend`).
# One address for everything, so a phone on the farm network only needs the PC's IP and port:
# the built app, the API (/api), Django admin (/admin) and its static files (/static).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Excel imports (protocols, employees, stock) go through /api.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's collectstatic output (admin, API docs), shared through a named volume.
    location /static/ {
        alias /srv/django-static/;
        expires 7d;
    }

    # Content-hashed build output: safe to cache forever (public/sw.js caches it first too).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Must always be revalidated, or a new version is never picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard/…) all serve the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
