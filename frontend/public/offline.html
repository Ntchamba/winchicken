<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b28" />
  <title>Hors ligne — Winchicken</title>
  <!-- Served by public/sw.js in place of any page that could not be loaded. Self-contained on
       purpose: no app JS, no web font, only the precached icon, so it renders with no network
       at all. It never offers to record anything — entries made offline are not kept. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #0d1b28; color: #e8f1ef;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(440px, 100%); text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 22px 0 10px; font-size: 26px; line-height: 1.2; color: #fff; }
    p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; color: rgba(232, 241, 239, .82); }
    .note {
      margin: 18px 0 24px; padding: 12px 14px; border-radius: 12px; text-align: left;
      background: rgba(23, 184, 146, .12); border: 1px solid rgba(94, 234, 212, .3); font-size: 15px;
    }
    button {
      min-height: 48px; padding: 12px 28px; border: 0; border-radius: 12px; cursor: pointer;
      background: #17b892; color: #082019; font: inherit; font-size: 16px; font-weight: 700;
    }
    button:focus-visible { outline: 3px solid #5eead4; outline-offset: 3px; }
    .status { margin-top: 16px; min-height: 22px; font-size: 14px; color: rgba(232, 241, 239, .6); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Vous êtes hors ligne</h1>
    <p>Winchicken n'arrive pas à joindre le serveur de la ferme. Vérifiez le Wi-Fi ou les données mobiles.</p>
    <p class="note">Rien ne peut être enregistré hors ligne. Faites vos saisies (mortalité, pesées, tâches, ventes…) une fois la connexion revenue.</p>
    <button type="button" id="retry">Réessayer</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    // Usually served by the worker at the URL that failed, so a reload retries that page.
    // Reached directly (index.html's script-failure fallback), `?retour=` says where to go back.
    const retry = () => {
      document.getElementById("status").textContent = "Nouvelle tentative…";
      const back = new URLSearchParams(location.search).get("retour");
      if (location.pathname === "/offline.html") location.replace(back && back.startsWith("/") ? back : "/dashboard");
      else location.reload();
    };
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
    // `online` never fires when the phone kept its Wi-Fi but the farm server was down, so also
    // ask the server itself every 10 s and come back as soon as it answers.
    setInterval(() => {
      fetch("/manifest.webmanifest", { cache: "no-store" }).then((r) => { if (r.ok) retry(); }, () => {});
    }, 10000);
  </script>
</body>
</html>
