<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winchicken</title>
    <meta name="description" content="Winchicken — gestion d'élevage avicole pour une ferme unique : bâtiments, bandes, stock, finance et alertes SMS en un seul outil." />
    <!-- Navy, not mint: matches the manifest's theme_color and the phone top bar, so an
         installed app's status bar and title bar read as part of the header. -->
    <meta name="theme-color" content="#0d1b28" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Winchicken" />
    <meta property="og:title" content="Winchicken" />
    <meta property="og:description" content="Gestion d'élevage avicole pour une ferme unique : bâtiments, bandes, stock, finance et alertes SMS en un seul outil." />
    <meta property="og:image" content="/logo-mark.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Safety net for a connection lost between the page and its scripts (the service worker
         can only swap the page itself): a script that fails to load would leave a blank page.
         Probe the server rather than trust navigator.onLine — a phone on the farm Wi-Fi is
         "online" while the farm server is down — and if it is unreachable, go to the offline
         screen, which comes back here once it can. -->
    <script>
      window.addEventListener("error", function (event) {
        var el = event.target;
        if (!el || el.tagName !== "SCRIPT" || window.__winchickenOffline) return;
        window.__winchickenOffline = true;
        fetch("/manifest.webmanifest", { cache: "no-store" }).then(
          function () { window.__winchickenOffline = false; },
          function () {
            location.replace("/offline.html?retour=" + encodeURIComponent(location.pathname + location.search + location.hash));
          }
        );
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
