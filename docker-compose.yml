services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: winchicken
      POSTGRES_USER: winchicken
      POSTGRES_PASSWORD: winchicken
    ports:
      - "5433:5432"
    volumes:
      - winchicken_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winchicken -d winchicken"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      # Docker-managed, not host-bind-mounted: the factory-reset audit log
      # (backend/config/settings.py LOGGING -> /app/logs/factory_reset.log) lives here.
      # A named volume sidesteps host/container uid mismatches entirely — Docker owns it,
      # so the container's non-root `appuser` (Dockerfile) can always write to it regardless
      # of what uid owns the bind-mounted ./backend tree on any given host. See
      # docs/deviations.md for the incident this fixes.
      - winchicken_backend_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: winchicken
      DB_USER: winchicken
      DB_PASSWORD: winchicken
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REDIS_URL: redis://redis:6379/0
      SMS_PROVIDER: console
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    volumes:
      - ./backend:/app
      - winchicken_backend_logs:/app/logs
    environment:
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: winchicken
      DB_USER: winchicken
      DB_PASSWORD: winchicken
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SMS_PROVIDER: console
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - winchicken_frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - web

volumes:
  winchicken_pgdata:
  winchicken_frontend_node_modules:
  winchicken_backend_logs:
