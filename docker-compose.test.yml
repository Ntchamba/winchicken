# Isolated verification stack — never touches the development farm.
#
# Run it under its own Compose project name, which is what actually provides the isolation:
# every named volume becomes `winchicken-test_*` instead of `winchicken_*`, so the test
# Postgres has a physically separate data directory from the dev one.
#
#   docker compose -p winchicken-test -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Ports are shifted so both stacks run side by side:
#
#   service     dev                     test
#   frontend    localhost:5173          localhost:5180
#   web         localhost:8000          localhost:8010
#   db          localhost:5433          localhost:5434
#   redis       localhost:6379          localhost:6380
#
# Live verification (browser, factory reset, seeded farms, worker/task fixtures) must be
# pointed at :5180. The `backup` service is disabled here on purpose — it writes dumps into
# the bind-mounted backend/backups/, which is shared with the dev stack, and test dumps have
# no business landing next to real ones.
services:
  db:
    environment:
      POSTGRES_DB: winchicken_test
      POSTGRES_USER: winchicken
      POSTGRES_PASSWORD: winchicken
    ports: !override
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winchicken -d winchicken_test"]

  redis:
    ports: !override
      - "6380:6379"

  web:
    ports: !override
      - "8010:8000"
    environment:
      DB_NAME: winchicken_test
      CORS_ALLOWED_ORIGINS: http://localhost:5180

  worker:
    environment:
      DB_NAME: winchicken_test

  beat:
    environment:
      DB_NAME: winchicken_test

  # Disabled rather than re-pointed: backups/ is a bind mount shared with the dev stack.
  backup:
    profiles: ["never"]

  frontend:
    ports: !override
      - "5180:5173"
    environment:
      VITE_API_URL: http://localhost:8010/api
